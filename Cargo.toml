[package]
name = "pykeleusma"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Python bindings for the Keleusma scripting language"
license = "0BSD"
repository = "https://github.com/sgeos/pykeleusma"
publish = false

[lib]
# The compiled extension is imported as `keleusma._keleusma` and re-exported by the
# pure-Python package under python/keleusma/.
name = "_keleusma"
crate-type = ["cdylib"]

[dependencies]
# Pinned exactly. The binding targets the published Keleusma 0.2.2 and moves to a
# later release deliberately, because 0.2.3 changes BYTECODE_VERSION from 1 to 2.
keleusma = "=0.2.2"
# The stable ABI from Python 3.12, so one wheel per platform serves every later
# Python version.
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
