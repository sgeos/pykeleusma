[package]
name = "pykeleusma"
# The Python distribution's version in pyproject.toml is authoritative. Cargo admits
# only three parts, so this carries the Keleusma release the binding is built against.
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
description = "Python bindings for the Keleusma scripting language"
license = "0BSD"
repository = "https://github.com/sgeos/pykeleusma"
publish = false

[lib]
# The compiled extension is imported as `keleusma._keleusma` and re-exported by the
# pure-Python package under python/keleusma/.
name = "_keleusma"
crate-type = ["cdylib"]

[dependencies]
# Pinned exactly. The binding targets the published Keleusma 0.2.2 and moves to a
# later release deliberately, because 0.2.3 changes BYTECODE_VERSION from 1 to 2.
# `shell` compiles in Keleusma's Shell library, which a script reaches only if its host
# passes `libraries=("shell",)`, since it can run commands and touch files.
# `signatures` and `encryption` provide the signed and encrypted modules of the book's
# chapters 26 and 36. The cryptography is Keleusma's and its dependencies', never ours.
keleusma = { version = "=0.2.2", features = ["shell", "signatures", "encryption"] }
# The Ed25519 key types Keleusma's signing API takes, at the major version Keleusma
# uses, so Cargo unifies the two.
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "zeroize"] }
# The stable ABI from Python 3.12, so one wheel per platform serves every later
# Python version.
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
# Owns the arena and the VM that borrows it as one value. See src/owned_vm.rs.
self_cell = "1.3.0"
