[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
# The distribution follows the py-prefix convention of wrappers such as pygit2,
# pyzmq and pycairo. The import package is plain `keleusma`.
name = "pykeleusma"
# The first three parts are the Keleusma release the binding is built against, and
# the fourth counts binding releases against it. Cargo admits only three parts, so
# this is the authoritative version and Cargo.toml carries the first three.
version = "0.2.2.0"
description = "Python bindings for the Keleusma scripting language"
readme = "README.md"
license = "0BSD"
# The wheel links Rust crates whose licenses require their notices to travel with
# binary copies. tools/third_party_licenses.py generates the file.
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.txt"]
authors = [{ name = "Brendan Sechter", email = "sgeos@hotmail.com" }]
# Python 3.12 is the verification baseline and the stable-ABI floor in Cargo.toml.
requires-python = ">=3.12"
dependencies = []
keywords = ["keleusma", "scripting", "interpreter", "wcet", "embedded-scripting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Interpreters",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/sgeos/pykeleusma"
Issues = "https://github.com/sgeos/pykeleusma/issues"
Changelog = "https://github.com/sgeos/pykeleusma/blob/main/CHANGELOG.md"
Keleusma = "https://github.com/sgeos/keleusma"

[dependency-groups]
dev = [
    "maturin==1.15.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
    "pyright==1.1.414",
    # The examples' dependencies, so their tests run in continuous integration.
    # pygame-ce installs as `pygame` and, unlike pygame 2.6, has wheels for every
    # Python the matrix tests, up to 3.15.
    "numpy==2.5.4",
    "pygame-ce==2.5.8",
    # The list PyPI checks classifiers against, so a typo fails a test, not an upload.
    "trove-classifiers==2026.9.21.13",
]

[tool.uv]
# uv reinstalls the project only when one of these changes. Without the Rust
# sources listed, `uv sync` keeps a stale extension after an edit to src/.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.maturin]
python-source = "python"
module-name = "keleusma._keleusma"
features = ["pyo3/extension-module"]
# Agent instructions and the scratch marker are repository tooling, not source.
exclude = [
    { path = "AGENTS.md", format = "sdist" },
    { path = "CLAUDE.md", format = "sdist" },
    { path = "tmp/**", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The examples are scripts, not a package, and their tests import them by name.
pythonpath = ["examples"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "S", "ANN", "RET", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Assertions are how pytest states expectations.
"tests/*" = ["S101"]

[tool.pyright]
include = ["python", "tests", "examples", "tools"]
extraPaths = ["examples"]
typeCheckingMode = "strict"
